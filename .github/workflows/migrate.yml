name: Database migrations (reviewed branches only)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment matching the selected branch
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]
      migration_action:
        description: Inspect first; push only reviewed forward migrations
        required: true
        default: dry-run
        type: choice
        options: [list, dry-run, push]

permissions:
  contents: read

jobs:
  migrate:
    if: >-
      (github.ref == 'refs/heads/dev' && inputs.environment == 'dev') ||
      (github.ref == 'refs/heads/staging' && inputs.environment == 'staging') ||
      (github.ref == 'refs/heads/main' && inputs.environment == 'prod')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.95.4
      - name: Verify target, link, and run the selected operation
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          MIGRATION_ACTION: ${{ inputs.migration_action }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
          node scripts/check-dev-supabase-target.mjs migrations
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          case "$MIGRATION_ACTION" in
            list) supabase migration list --linked ;;
            dry-run) supabase db push --linked --include-all --dry-run ;;
            push) supabase db push --linked --include-all ;;
            *) exit 1 ;;
          esac
# No reset/repair, secret logging, eval, or automatic retry of database writes.
